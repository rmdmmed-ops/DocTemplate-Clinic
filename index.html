<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d2033" />
<meta name="description" content="DocTemplate Ortopedia 4.0 — modelos clínicos com mapa anatômico." />
<title>DocTemplate Ortopedia 4.0</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DocTemplate" />
<link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
<div class="app" id="app">

  <section class="col c1" id="c1">
    <div class="brand">
      <div class="mk">+</div>
      <div><strong>DocTemplate</strong><span>ORTOPEDIA · 4.1</span></div>
      <button class="fecha-menu" id="fechaMenu" aria-label="Fechar menu">×</button>
    </div>
    <div class="gsearch">
      <span class="ic" aria-hidden="true">⌕</span>
      <input id="gs" type="search" placeholder="Buscar em todos os módulos…" aria-label="Buscar em todos os módulos" autocomplete="off" />
      <kbd>Ctrl K</kbd>
    </div>
    <nav class="nav" id="nav" aria-label="Módulos clínicos"></nav>
    <div class="rodape">
      <div class="status"><span class="pt" id="pt"></span><span id="salvo">Salvo neste navegador</span></div>
      <div class="acoes">
        <button id="btExportar" title="Baixa um arquivo .json com seus modelos e edições">⇩ Exportar</button>
        <button id="btImportar" title="Lê um arquivo .json exportado antes">⇧ Importar</button>
        <input id="arquivo" type="file" accept=".json,application/json" hidden />
      </div>
      <a class="anterior" href="3.2/">Abrir a versão 3.2 (anterior)</a>
    </div>
  </section>

  <section class="col c2" id="c2">
    <div class="cab">
      <h2>Segmento</h2>
      <span class="vista" id="vista">Frente</span>
    </div>
    <div class="palco" id="palco"></div>
    <div class="vistas" id="vistas" role="group" aria-label="Como ver o corpo">
      <button type="button" data-vista="corpo" aria-pressed="true">Corpo</button>
      <button type="button" data-vista="maos" aria-pressed="false">Mãos</button>
      <button type="button" data-vista="pes" aria-pressed="false">Pés</button>
    </div>
    <div class="pe2">
      <div class="sel" id="sel"></div>
      <button class="bilat" id="bilat" aria-pressed="false" hidden><span class="bx" aria-hidden="true"></span> Bilateral (direito e esquerdo)</button>
      <div class="mecwrap" id="mecwrap" hidden>
        <label for="mec">Mecanismo de trauma</label>
        <select id="mec"></select>
        <input id="mecLivre" type="text" placeholder="Descreva o mecanismo" hidden aria-label="Mecanismo de trauma" />
      </div>
      <p class="dica" id="dica"></p>
    </div>
  </section>

  <section class="col c3" id="c3">
    <div class="cab3">
      <div class="tit">
        <div class="olho" id="olho">—</div>
        <h2 id="nome">Selecione um modelo</h2>
      </div>
      <div class="acoes3">
        <button class="opt" id="btVars" hidden title="Inserir variável no texto">＋ variável</button>
        <button class="opt" id="btRestaurar" hidden>Restaurar original</button>
        <button class="copiar" id="btCopiar" hidden>COPIAR TUDO</button>
      </div>
    </div>
    <div class="docs" id="docs"></div>
  </section>

  <button class="menu-bt" id="menuBt" aria-label="Abrir menu">☰</button>
  <button class="veu" id="veu" aria-label="Fechar menu"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-fundo" id="modalVars" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="varsTit">
      <h3 id="varsTit">Inserir variável</h3>
      <p>Clique para inserir no ponto onde o cursor estava. O aplicativo troca pelo valor escolhido no mapa.</p>
      <div class="vgrid" id="vgrid"></div>
      <div class="modal-acoes"><button data-fecha>Fechar</button></div>
    </div>
  </div>
</div>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((registro) => {
        const oferecer = (worker) => {
          const toast = document.getElementById("toast");
          if (!toast) return;
          toast.textContent = "Nova versão disponível. Toque para atualizar.";
          toast.classList.add("on", "acao");
          toast.onclick = () => { worker.postMessage("SKIP_WAITING"); toast.textContent = "Atualizando…"; };
        };
        if (registro.waiting) oferecer(registro.waiting);
        registro.addEventListener("updatefound", () => {
          const worker = registro.installing;
          if (!worker) return;
          worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) oferecer(worker);
          });
        });
      }).catch(() => {});
      // Só recarrega quando é ATUALIZAÇÃO de uma versão já instalada; na primeira
      // visita o worker assume o controle e isso não pode virar um recarregamento
      // surpresa no meio do plantão.
      const tinhaControle = Boolean(navigator.serviceWorker.controller);
      let recarregando = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!tinhaControle || recarregando) return;
        recarregando = true;
        window.location.reload();
      });
    });
  }
</script>
<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
